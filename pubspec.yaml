name: paysuite
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.0

#==== Dependencies start ====#
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  get: ^4.6.6
  shared_preferences: ^2.2.2
  flutter_launcher_icons: ^0.14.4
  flutter_svg: ^2.0.9
  shimmer_animation: ^2.1.0+1
  http: ^1.1.0
  intl: ^0.20.2
  fl_chart: ^1.1.1
  carousel_slider: ^5.0.0
  dotted_border: ^2.1.0
  image_picker:
  syncfusion_flutter_charts: ^31.1.19
  pin_code_fields: ^8.0.1
  country_picker: ^2.0.25
  permission_handler: ^12.0.1
  path_provider: ^2.1.3
  flutter_paypal: ^0.2.1
  razorpay_flutter: ^1.3.7
  flutter_stripe: ^12.1.1
  flutter_local_notifications: ^19.5.0
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  flutter_pdfview: ^1.3.2
  open_filex: ^4.4.0
  share_plus: ^12.0.1
  url_launcher: ^6.3.1
  confetti: ^0.8.0
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  oc_liquid_glass: ^0.2.1
  file_picker: ^10.3.6
  html_editor_enhanced: ^2.7.1
  flutter_html: ^3.0.0
  webview_flutter: ^4.9.0
  flutter_inappwebview: ^6.1.5
  flutter_animate: ^4.5.2

#==== Dev Dependencies start ====#

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0

#==== App Icon Section ====#
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/logo.jpg"

flutter:
  uses-material-design: true

  #==== Assets start ====#
  assets:
    - assets/
    - assets/image/
    - assets/icon/
    - assets/icon/flag/
    - assets/logo/
    - assets/language/

  #==== FONT start ====#
  fonts:
    - family: GoogleSansFlex_9pt
      fonts:
        - asset: assets/font/GoogleSansFlex_9pt-Regular.ttf
          weight: 400
        - asset: assets/font/GoogleSansFlex_9pt-Regular.ttf
          weight: 500
        - asset: assets/font/GoogleSansFlex_9pt-Regular.ttf
          weight: 700
        - asset: assets/font/GoogleSansFlex_9pt-Regular.ttf
          weight: 900
